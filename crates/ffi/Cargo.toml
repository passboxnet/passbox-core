[package]
name = "passbox-ffi"
description = "Swift and Kotlin bindings (UniFFI) for the Passbox client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "passbox_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
passbox-client.workspace = true
passbox-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = "0.32"

# On Android the system certificate verifier is reached through the JVM and
# must be initialized once with the app context (see `src/android.rs`).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
