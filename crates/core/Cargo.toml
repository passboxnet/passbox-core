[package]
name = "passbox-core"
description = "Passbox cryptographic core: key derivation, encryption, TOTP and password generation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
opaque-ke.workspace = true
opaque-rand-core.workspace = true
opaque-sha2.workspace = true
p256.workspace = true
ring = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
x-wing.workspace = true
zeroize.workspace = true
zxcvbn.workspace = true

[features]
# OpenID Connect ID token verification (the server's SSO); not built for WebAssembly.
oidc = ["dep:ring"]
# A test identity provider that signs ID tokens (server integration tests).
test-issuer = ["oidc"]

[lints]
workspace = true
