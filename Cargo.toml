[workspace]
resolver = "3"
members = ["crates/core", "crates/core-wasm", "crates/client", "crates/ffi", "crates/ai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/passboxnet/core"
rust-version = "1.87"

[workspace.dependencies]
passbox-core = { path = "crates/core" }
passbox-client = { path = "crates/client" }

anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = "0.8"
chacha20poly1305 = "0.11"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
# Account signing keys (Ed25519). Exact pin: sharing depends on its behavior.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
# SMTP with rustls (ring) and the platform's certificate store; no OpenSSL.
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier"] }
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
# opaque-ke 4 is built on the previous RustCrypto and rand generations.
opaque-rand-core = { package = "rand_core", version = "0.6", features = ["getrandom"] }
opaque-sha2 = { package = "sha2", version = "0.10" }
# ID token signature verification for SSO (RSA and ECDSA); already used by rustls.
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PostgreSQL only (docs/adr/0007-postgresql-only.md); TLS with rustls (ring) and the
# platform's certificate store, like the rest of the workspace.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "tls-rustls-ring-native-roots"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5"
ureq = { version = "3.5", features = ["platform-verifier"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
wasm-bindgen = "0.2"
# Hybrid X25519 + ML-KEM-768 key encapsulation (draft-connolly-cfrg-xwing-kem), RustCrypto.
x-wing = { version = "=0.1.1", features = ["zeroize"] }
zxcvbn = { version = "3.1", default-features = false }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Line tables keep backtraces readable while making debug and test binaries
# several times smaller; dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

# Key derivation is deliberately expensive; optimize it even in debug builds
# so tests and development builds stay fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
